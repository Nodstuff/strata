<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>strata playground</title>
<style>
:root{--bg:#f5f4f1;--ink:#1c1c1f;--muted:#6a6a72;--line:#00000022;--panel:#fff;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121215;--ink:#ececf1;--muted:#9c9ca8;--line:#ffffff22;--panel:#1b1b20;--bad:#ff8a80}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,sans-serif}
main{display:grid;grid-template-columns:minmax(280px,34%) 1fr;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
header b{font-size:14px} header span{color:var(--muted)} header .sp{flex:1}
button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
textarea{border:0;border-right:1px solid var(--line);resize:none;padding:12px;background:var(--panel);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace;outline:none;tab-size:2}
iframe{border:0;width:100%;height:100%;background:var(--bg)}
#msg{grid-column:1/3;padding:6px 12px;border-top:1px solid var(--line);color:var(--muted);white-space:pre-wrap;max-height:22vh;overflow:auto}
#msg.bad{color:var(--bad)}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto 38% 1fr auto}header,#msg{grid-column:1}textarea{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<main>
<header><b>strata</b><span>the diagram is drawn in this browser; nothing is sent anywhere</span><span class="sp"></span>
<select id="ex" aria-label="Example"><option value="">Examples</option><option value="shop">Shop platform</option><option value="placed">Stated placement</option></select>
<button id="dl">Download page</button></header>
<textarea id="src" spellcheck="false" aria-label="Diagram source (YAML)"></textarea>
<iframe id="out" title="Diagram" sandbox="allow-scripts"></iframe>
<div id="msg">Loading…</div>
</main>
<script type="module">
import { render } from '../dist/strata.browser.js';
const $ = id => document.getElementById(id), src = $('src'), out = $('out'), msg = $('msg');
const START = `title: My system
nodes:
  - id: web
    label: Web app
    kind: service
  - id: api
    label: API
    kind: service
    nodes:
      - {id: auth, label: Sign-in}
      - {id: orders, label: Orders}
  - id: db
    label: Postgres
    kind: store
    shape: cylinder
edges:
  - [web, api, HTTPS]
  - [auth, orders, session]
  - [orders, db, SQL]
`;
let last = null, run = 0, timer = 0;
async function draw() {
  const mine = ++run, t = performance.now();
  try {
    const r = await render(src.value);
    if (mine !== run) return; // a newer edit is already being drawn
    last = r; out.srcdoc = r.html;
    msg.className = ''; msg.textContent = [`${r.boxes} boxes · ${r.arrows} arrows · ${r.depth} levels · drawn in ${Math.round(performance.now() - t)} ms`, ...r.warnings.map(w => 'warning: ' + w)].join('\n');
  } catch (e) { if (mine === run) { msg.className = 'bad'; msg.textContent = e.message; } } // the last good picture stays
  try { localStorage.setItem('strata.src', src.value); } catch (e) { /* private window: nothing to keep */ }
}
src.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 350); });
src.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); src.setRangeText('  ', src.selectionStart, src.selectionEnd, 'end'); } });
$('ex').addEventListener('change', async e => { if (!e.target.value) return; src.value = await (await fetch(`../examples/${e.target.value}.yaml`)).text(); e.target.value = ''; draw(); });
$('dl').addEventListener('click', () => {
  if (!last) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([last.html], { type: 'text/html' }));
  a.download = (last.title || 'diagram').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
let saved = null; try { saved = localStorage.getItem('strata.src'); } catch (e) { /* none */ }
src.value = saved || START; draw();
</script>
</body>
</html>
